<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>TindaGo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="img/TindaGo_logo.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="phone-frame">
    <div class="phone-notch"></div>
    <div class="app-container" id="app">

      <!-- SETUP OVERLAY (first-time onboarding) -->
      <div class="overlay" id="setupOverlay">
        <div class="overlay-content overlay-sm" style="justify-content:center;height:100%;padding:24px;">
          <div style="text-align:center;margin-bottom:24px;">
            <div style="margin-bottom:12px;">
              <img src="img/TindaGo_logo.png" alt="TindaGo" style="width:80px;height:80px;border-radius:20px;box-shadow:0 4px 16px rgba(22,163,74,0.25);">
            </div>
            <h2 style="font-size:var(--text-2xl);margin-bottom:4px;" data-i18n="setupTitle">Maligayang pagdating sa TindaGo!</h2>
            <p style="color:var(--text-secondary);" data-i18n="setupSubtitle">Magsimula tayo. Sabihin sa amin ang tungkol sa iyong tindahan.</p>
          </div>
          <div class="form-group">
            <label data-i18n="settingsStore">Pangalan ng Tindahan</label>
            <input type="text" id="setupStoreName" class="form-input" data-i18n-placeholder="setupStorePlaceholder" placeholder="Hal. Tindahan ni Maria">
          </div>
          <div class="form-group">
            <label data-i18n="settingsOwner">Pangalan ng May-ari</label>
            <input type="text" id="setupOwnerName" class="form-input" data-i18n-placeholder="setupOwnerPlaceholder" placeholder="Hal. Maria Santos">
          </div>
          <div class="form-group">
            <label data-i18n="settingsLanguage">Wika</label>
            <div class="lang-chip-options" id="setupLanguage">
              <button class="lang-chip-btn" data-lang="fil" onclick="setSetupLanguage('fil')">Filipino</button>
              <button class="lang-chip-btn" data-lang="en" onclick="setSetupLanguage('en')">English</button>
            </div>
          </div>
          <button class="btn btn-primary btn-full" data-i18n="setupBtn" onclick="completeSetup()">Magsimula na!</button>
        </div>
      </div>

      <!-- TOAST -->
      <div class="toast-container" id="toastContainer"></div>
    </div>
    <div class="phone-home-bar"></div>
  </div>

  <script src="db_indexed.js"></script>
  <script src="supabase.js"></script>
  <script src="sync.js"></script>
  <script src="backup.js"></script>
<script src="app.js"></script>
</body>
</html>
