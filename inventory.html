<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="img/TindaGo_logo.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>TindaGo - Stock</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    /* Category Search Field component from index.html */
    .search-control {
      position: relative;
      display: flex;
      width: 100%;
      height: 52px;
      margin-bottom: 12px;
    }
    .category-container {
      position: relative;
      flex: 1;
      min-width: 0;
      height: 52px;
      background: white;
      border: 1px solid var(--border, #cfcfcf);
      border-right: none;
      border-radius: 12px 0 0 12px;
    }
    .category-button {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      border: none;
      background: transparent;
      cursor: pointer;
      font-size: var(--text-base, 16px);
      color: var(--text, #222);
      text-align: left;
    }
    .category-button:hover { background: #fafafa; }
    .category-label {
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }
    .arrow {
      margin-left: 10px;
      font-size: 12px;
      color: #777;
    }
    .tiles-icon {
      display: none;
      grid-template-columns: repeat(2, 7px);
      grid-template-rows: repeat(2, 7px);
      gap: 3px;
    }
    .tiles-icon span {
      display: block;
      width: 7px;
      height: 7px;
      border: 1.8px solid #444;
      border-radius: 1.5px;
    }
    .action-button {
      width: 52px;
      height: 52px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--border, #cfcfcf);
      border-radius: 0 12px 12px 0;
      background: white;
      cursor: pointer;
    }
    .action-button:hover { background: #fafafa; }
    .search-input {
      display: none;
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      padding: 0 16px;
      border: 1px solid var(--border, #cfcfcf);
      border-radius: 12px 0 0 12px;
      background: white;
      font-size: var(--text-base, 16px);
      color: var(--text, #222);
      outline: none;
    }
    .category-dropdown {
      display: none;
      position: absolute;
      top: calc(100% + 6px);
      left: 0;
      width: 280px;
      max-height: 320px;
      overflow-y: auto;
      background: white;
      border: 1px solid var(--border, #cfcfcf);
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.12);
      z-index: 1000;
      padding: 8px;
    }
    .category-dropdown.open { display: block; }
    .category-item {
      padding: 10px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 15px;
      color: #333;
    }
    .category-item:hover { background: #f0fdf4; color: #16a34a; }
    .category-item.active { background: #dcfce7; color: #15803d; font-weight: 600; }
    .search-control.search-mode { flex-direction: row-reverse; }
    .search-control.search-mode .category-container { order: 2; flex: 0 0 52px; width: 52px; min-width: 52px; border-radius: 0 12px 12px 0; border-left: none; border-right: 1px solid var(--border, #cfcfcf); }
    .search-control.search-mode .action-button { order: 1; flex: 1; width: auto; border-radius: 12px 0 0 12px; border-right: none; border-left: 1px solid var(--border, #cfcfcf); position: relative; padding: 0; }
    .search-control.search-mode .category-label,
    .search-control.search-mode .arrow { display: none; }
    .search-control.search-mode .tiles-icon { display: grid; }
    .search-control.search-mode .category-button { justify-content: center; padding: 0; width: 100%; height: 100%; }
    .search-control.search-mode .search-input { display: block; border-radius: 12px 0 0 12px; border-right: none; width: 100%; height: 100%; }
  </style>
</head>

<script src="app.js"></script>
  <script>
    // Category / subcategory search-control dropdown.
    // Built dynamically from the 12-key taxonomy exposed by app.js
    // (window.PRODUCT_CATEGORIES / window.PRODUCT_SUBCATEGORIES), matching the
    // checkout dropdown pattern. Selecting a category drills into its
    // subcategories; picking one applies the inventory filter.
    const searchControl = document.getElementById('searchControl');
    const categoryButton = document.getElementById('categoryButton');
    const categoryDropdown = document.getElementById('categoryDropdown');
    const categoryLabel = document.getElementById('categoryLabel');
    const actionButton = document.getElementById('actionButton');
    const searchIcon = document.getElementById('searchIcon');
    const searchInput = document.getElementById('manageStockSearch');

    let currentCategoryFilter = '';
    let currentSubcatFilter = '';
    // Stage 2: initialize from app.js's persisted filters (same sessionStorage
    // keys) so the button label and dropdown active-row reflect the state saved
    // in the previous session instead of always resetting to "All Categories".
    try {
      var _pCat = sessionStorage.getItem('sss_v3_inventoryCat') || '';
      var _pSub = sessionStorage.getItem('sss_v3_inventorySubcat') || '';
      if (_pCat && resolveCats().indexOf(_pCat) !== -1) currentCategoryFilter = _pCat;
      if (_pSub && resolveSubs(_pCat).indexOf(_pSub) !== -1) currentSubcatFilter = _pSub;
    } catch(e) {}

    function resolveCats(){
      try{ if(window.PRODUCT_CATEGORIES && window.PRODUCT_CATEGORIES.length) return window.PRODUCT_CATEGORIES.slice(); }catch(e){}
      return [];
    }
    function resolveSubs(cat){
      try{ if(window.PRODUCT_SUBCATEGORIES && window.PRODUCT_SUBCATEGORIES[cat]) return window.PRODUCT_SUBCATEGORIES[cat]; }catch(e){}
      return [];
    }
    function catLabel(k){
      if(!k) return (window.t ? window.t('catAll') : 'All Categories');
      try{ if(window.productCategoryLabel) return window.productCategoryLabel(k); }catch(e){}
      return k;
    }
    function subLabel(k){
      if(!k) return '';
      var out = '';
      try{ if(window.productSubcategoryLabel) out = window.productSubcategoryLabel(k); }catch(e){}
      if(out && !/^sub[A-Z]/.test(out) && out !== k) return out;
      return String(k).replace(/_/g,' ').replace(/\b\w/g, function(c){ return c.toUpperCase(); });
    }
    function esc(s){
      var d = document.createElement('div');
      d.textContent = (s == null) ? '' : String(s);
      return d.innerHTML;
    }

    function render(level){
      var html = '';
      if(level === 'categories'){
        html += '<div class="category-item' + (currentCategoryFilter === '' ? ' active' : '') + '" data-cat="">' + esc(catLabel('')) + '</div>';
        var cats = resolveCats();
        for(var i = 0; i < cats.length; i++){
          var k = cats[i];
          var active = (currentCategoryFilter === k && !currentSubcatFilter) ? ' active' : '';
          html += '<div class="category-item' + active + '" data-cat="' + k + '">' + esc(catLabel(k)) + '</div>';
        }
      } else {
        var cur = currentCategoryFilter;
        var base = resolveSubs(cur);
        html += '<div class="category-item category-back" data-action="back">\u2190 ' + esc(catLabel(cur)) + '</div>';
        html += '<div class="category-item' + (currentSubcatFilter === '' ? ' active' : '') + '" data-sub="">' + esc('All ' + catLabel(cur)) + '</div>';
        for(var j = 0; j < base.length; j++){
          var s = base[j];
          html += '<div class="category-item' + (currentSubcatFilter === s ? ' active' : '') + '" data-sub="' + s + '">' + esc(subLabel(s)) + '</div>';
        }
      }
      categoryDropdown.innerHTML = html;
    }

    function updLabel(){
      if(currentCategoryFilter && currentSubcatFilter){
        categoryLabel.textContent = subLabel(currentSubcatFilter);
      } else if(currentCategoryFilter){
        categoryLabel.textContent = catLabel(currentCategoryFilter);
      } else {
        categoryLabel.textContent = window.t ? window.t('catAll') : 'Category';
      }
    }

    function selectCategory(catKey){
      currentCategoryFilter = catKey;
      currentSubcatFilter = '';
      updLabel();
      closeDropdown();
      if(typeof window.setInventoryCatFilter === 'function'){
        window.setInventoryCatFilter(catKey);
      } else if(typeof window.renderManageInventory === 'function'){
        window.renderManageInventory();
      }
      if(catKey){
        render('subcategories');
        openDropdown();
      }
    }

    function selectSubcategory(subKey){
      currentSubcatFilter = subKey;
      updLabel();
      closeDropdown();
      if(typeof window.setInventorySubcatFilter === 'function'){
        window.setInventorySubcatFilter(subKey);
      } else if(typeof window.renderManageInventory === 'function'){
        window.renderManageInventory();
      }
    }

    function backToCategories(){
      currentSubcatFilter = '';
      render('categories');
    }

    function toggleDropdown(event){
      event.stopPropagation();
      if(categoryDropdown.classList.contains('open')){
        closeDropdown();
      } else {
        openDropdown();
      }
    }

    function openDropdown(){
      if(currentCategoryFilter && resolveSubs(currentCategoryFilter).length){
        render('subcategories');
      } else {
        render('categories');
      }
      categoryDropdown.classList.add('open');
      categoryButton.setAttribute('aria-expanded', 'true');
    }

    function closeDropdown(){
      categoryDropdown.classList.remove('open');
      categoryButton.setAttribute('aria-expanded', 'false');
    }

    function enterSearchMode(){
      searchControl.classList.add('search-mode');
      closeDropdown();
      searchIcon.style.display = 'none';
      searchInput.style.display = 'block';
      setTimeout(() => searchInput.focus(), 50);
    }

    function exitSearchMode(){
      searchControl.classList.remove('search-mode');
      searchIcon.style.display = 'block';
      searchInput.style.display = 'none';
      if(searchInput.value.trim()){
        searchInput.value = '';
        if(typeof window.renderManageInventory === 'function'){
          window.renderManageInventory();
        }
      }
    }

    categoryButton.addEventListener('click', function(e){
      if(searchControl.classList.contains('search-mode')){
        exitSearchMode();
        e.stopPropagation();
      } else {
        toggleDropdown(e);
      }
    });

    actionButton.addEventListener('click', function(e){
      if(!searchControl.classList.contains('search-mode')){
        enterSearchMode();
        e.stopPropagation();
      }
    });

    searchInput.addEventListener('input', function(){
      if(typeof window.renderManageInventory === 'function'){
        window.renderManageInventory();
      }
    });

    // Delegated dropdown clicks â€” avoids detached-target bug from innerHTML re-render.
    categoryDropdown.addEventListener('click', function(e){
      var t = e.target.closest('[data-cat],[data-sub],[data-action]');
      if(!t || !categoryDropdown.contains(t)) return;
      e.stopPropagation();
      var cat = t.getAttribute('data-cat');
      if(cat !== null){ selectCategory(cat); return; }
      var sub = t.getAttribute('data-sub');
      if(sub !== null){ selectSubcategory(sub); return; }
      var act = t.getAttribute('data-action');
      if(act === 'back'){ backToCategories(); }
    });

    document.addEventListener('click', function(event){
      if(!searchControl.contains(event.target)){
        closeDropdown();
      }
    });

    // Re-render on language change if the dropdown is open.
    try{
      window.addEventListener('tindago:languageChanged', function(){
        updLabel();
        if(categoryDropdown.classList.contains('open')){
          openDropdown();
        }
      });
    }catch(e){}

    updLabel();

  </script>
</body>
