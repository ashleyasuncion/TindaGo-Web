<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="img/TindaGo_logo.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>TindaGo - Help</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="phone-frame">
    <div class="phone-notch"></div>
    <div class="app-container" id="app">
      <!-- HEADER -->
      <header class="app-header" style="background:var(--primary);color:white;">
        <button class="header-btn" onclick="historyBack()" style="color:white;background:none;border:none;cursor:pointer;display:flex;align-items:center;padding:6px;">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
        </button>
        <h1 style="font-size:var(--text-xl);font-weight:700;flex:1;text-align:center;" data-i18n="helpTitle">Help</h1>
        <button class="header-btn header-tutorial-btn" id="headerTutorialBtn" onclick="startTutorial('help', true)" aria-label="Tutorial" style="color:white;">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
        </button>
      </header>

      <!-- CONTENT -->
      <main class="app-content" id="appContent">
        <button class="btn btn-secondary btn-full" onclick="startTutorial('main', true)" data-i18n="replayTutorial" style="margin-bottom:16px;">Replay Tutorial</button>

        <div id="helpTutSelector" style="background:var(--surface,#f8fafc);border:1px solid var(--border,#e2e8f0);border-radius:12px;padding:14px;margin-bottom:16px;">
          <div style="font-weight:700;color:var(--primary,#16a34a);margin-bottom:8px;" data-i18n="tutSelector">Select a tutorial...</div>
          <div class="tutorial-selector-row">
            <select id="tutorialSelector" class="form-input">
              <option value="" data-i18n="tutSelector">Select a tutorial...</option>
              <option value="main" data-i18n="tutMain">Main Tutorial</option>
              <option value="morning" data-i18n="tutMorning">Morning Check Tutorial</option>
              <option value="day" data-i18n="tutDay">Day Mode Tutorial</option>
              <option value="checkout" data-i18n="tutCheckout">Checkout Tutorial</option>
              <option value="closing" data-i18n="tutClosing">Closing Tutorial</option>
              <option value="inventory" data-i18n="tutInventory">Stock Tutorial</option>
              <option value="debts" data-i18n="tutDebts">Debts Tutorial</option>
              <option value="setting" data-i18n="tutSetting">Settings Tutorial</option>
              <option value="add_product" data-i18n="tutAddProduct">Add Product Tutorial</option>
              <option value="restock" data-i18n="tutRestock">Restock Day Tutorial</option>
              <option value="new_debt" data-i18n="tutNewDebt">New Debt Tutorial</option>
              <option value="product_detail" data-i18n="tutProductDetail">Product Detail Tutorial</option>
              <option value="debtor_detail" data-i18n="tutDebtorDetail">Customer Debt Detail Tutorial</option>
              <option value="record_payment" data-i18n="tutRecordPayment">Record Payment Tutorial</option>
              <option value="expenses" data-i18n="tutExpenses">Store Expenses Tutorial</option>
              <option value="report" data-i18n="tutReport">Reports Tutorial</option>
              <option value="help" data-i18n="tutHelp">Help Tutorial</option>
            </select>
            <button class="btn btn-primary" onclick="launchTutorial()" data-i18n="tutLaunch">Launch</button>
          </div>
        </div>

        <div id="helpHowTo" style="background:var(--surface,#f8fafc);border:1px solid var(--border,#e2e8f0);border-radius:12px;padding:14px;margin-bottom:16px;">
          <div style="font-weight:700;margin-bottom:8px;" data-i18n="howToUse">How to Use</div>
          <div id="howToList"></div>
        </div>

        <div id="helpContact" style="background:var(--surface,#f8fafc);border:1px solid var(--border,#e2e8f0);border-radius:12px;padding:14px;margin-bottom:16px;">
          <div style="font-weight:700;margin-bottom:6px;" data-i18n="contactInfo">Contact</div>
          <div style="font-size:var(--text-sm);color:var(--text-secondary,#64748b);" data-i18n="contactText">For questions or feedback, email support@tindago.com</div>
        </div>

        <div id="helpAbout" style="background:var(--surface,#f8fafc);border:1px solid var(--border,#e2e8f0);border-radius:12px;padding:14px;margin-bottom:16px;">
          <div style="font-weight:700;margin-bottom:6px;" data-i18n="aboutApp">About App</div>
          <div style="font-size:var(--text-sm);color:var(--text-secondary,#64748b);" data-i18n="aboutText">TindaGo v3.0 — a store management app for sari-sari store owners.</div>
        </div>

        <a href="download.html" class="btn btn-primary btn-full" style="text-decoration:none;margin-bottom:16px;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          Download Mobile App
        </a>

      </main>

      <div class="toast-container" id="toastContainer"></div>
    </div>
    <div class="phone-home-bar"></div>
  </div>

  <!-- TUTORIAL OVERLAY (outside phone-frame for correct position:fixed behavior) -->
  <div id="tutorialRoot">
    <div class="tutorial-overlay" id="tutorialOverlay" style="display:none;">
      <div class="tutorial-backdrop" id="tutorialBackdrop"></div>
      <div class="tutorial-highlight" id="tutorialHighlight"></div>
      <div class="tutorial-box" id="tutorialBox">
        <div class="tutorial-step-indicator">
          <span id="tutorialCurrent">1</span>/<span id="tutorialTotal">6</span>
        </div>
        <div class="tutorial-text" id="tutorialText">Welcome to TindaGo!</div>
        <div class="tutorial-actions">
          <button class="btn btn-secondary btn-sm" id="tutorialSkip" onclick="endTutorial()" data-i18n="skip" style="display:none;">Skip</button>
          <button class="btn btn-secondary btn-sm" id="tutorialPrev" onclick="previousTutorial()" data-i18n="prev" style="display:none;">Previous</button>
          <button class="btn btn-primary btn-sm" id="tutorialNext" onclick="advanceTutorial()" data-i18n="next">Next</button>
        </div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
