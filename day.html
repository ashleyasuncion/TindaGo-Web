<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="img/TindaGo_logo.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>TindaGo - Day</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="phone-frame">
    <div class="phone-notch"></div>
    <div class="app-container" id="app">

      <!-- HEADER -->
      <header class="app-header">
        <div class="header-left">
          <h1 class="header-page-title" id="headerPageTitle" data-i18n="pageDay">Araw</h1>
        </div>
        <div class="header-actions">
          <button class="header-btn header-tutorial-btn" id="headerTutorialBtn" onclick="startTutorial('day', true)" aria-label="Tutorial">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
          </button>
          <a class="header-btn" aria-label="Manage Store" href="inventory.html">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
          </a>
        </div>
      </header>

      <!-- MAIN CONTENT -->
      <main class="app-content" id="appContent">

        <!-- DAY MODE -->
        <div class="moment-screen">
          <div class="day-summary" id="daySummary">
            <div class="day-summary-header">
              <div class="day-summary-label" data-i18n="dayModeLabel">Today</div>
              <div class="day-summary-date" id="dayDate">June 15, 2026</div>
            </div>

            <div class="day-stats-grid">
              <div class="day-stat-card">
                <div class="day-stat-icon cash-bg">
                  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
                </div>
                <div class="day-stat-label" data-i18n="dayEarningsLabel">Cash Sales Today</div>
                <div class="day-stat-value" id="dayEarnings">₱0.00</div>
              </div>
              <div class="day-stat-card">
                <div class="day-stat-icon item-bg">
                  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/></svg>
                </div>
                <div class="day-stat-label" data-i18n="dayItemsSoldLabel">Items Sold</div>
                <div class="day-stat-value" id="dayItemsSold">0</div>
              </div>
              <div class="day-stat-card">
                <div class="day-stat-icon debt-bg">
                  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="12" rx="2"/><path d="M12 12h.01"/></svg>
                </div>
                <div class="day-stat-label" data-i18n="dayUtangLabel">Debts</div>
                <div class="day-stat-value" id="dayUtang">₱0.00</div>
              </div>
            </div>

            <!-- Today's transactions -->
            <div class="day-transactions" id="dayTransactions">
              <div class="day-transactions-header" onclick="toggleDayTransactions()">
                <div class="section-label" data-i18n="dayTransactionsLabel">Today's Transactions</div>
                <svg class="day-transactions-chevron" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
              </div>
              <div class="list-container" id="dayTransactionList">
                <!-- V2.68: fallback synced to the localized noTransactions text
                     (runtime replaces this with t('noTransactions')) — the old
                     "May Bumili" sales-sheet wording is gone. -->
                <div class="empty-state">No transactions yet — start selling to see them here!</div>
              </div>
            </div>
          </div>

          <!-- Store Expenses entry point (V2.71) -->
          <button class="btn btn-outline btn-large" id="btnExpenses" onclick="goToExpenses()" style="margin-bottom:10px;justify-content:space-between;">
            <span data-i18n="dayExpensesBtn">Store Expenses Today</span>
            <span id="dayExpensesTotal" style="font-weight:700;color:var(--danger);">₱0.00</span>
          </button>

          <button class="btn btn-primary btn-large close-day-btn" id="btnCloseDay" onclick="showClosingScreen()">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
            <span data-i18n="closeDay">Isara ang Tindahan 🌙</span>
          </button>
        </div>
      </main>

      <!-- BOTTOM NAV -->
      <nav class="bottom-nav">
        <a class="nav-item" href="morning.html">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/></svg>
          <span class="nav-label" data-i18n="navMorning">Umaga</span>
        </a>
        <div class="nav-spacer"></div>
        <button class="nav-item nav-fab-item active" id="navSale" onclick="openSaleSheet()">
          <div class="nav-fab">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          </div>
          <span class="nav-label" data-i18n="navSale">Benta</span>
        </button>
        <div class="nav-spacer"></div>
        <button class="nav-item" id="navClose" onclick="showClosingScreen()">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
          <span class="nav-label" data-i18n="navClose">Isara</span>
        </button>
      </nav>

      <!-- BOTTOM SHEET: DEBT PAYMENT -->
      <div class="bottom-sheet-overlay" id="paymentSheetOverlay" onclick="closePaymentSheet()">
        <div class="bottom-sheet" id="paymentSheet" onclick="event.stopPropagation()">
          <div class="sheet-handle"></div>
          <div class="sheet-header">
            <h2 class="sheet-title" data-i18n="payTitle">Magbayad</h2>
          </div>
          <div class="sheet-body">
            <div class="payment-customer-info" id="paymentCustomerInfo">
              <div class="payment-customer-name" id="paymentCustomerName"></div>
              <div class="payment-customer-balance" id="paymentCustomerBalance">Balanse: ₱0.00</div>
            </div>
            <div class="form-group">
              <label data-i18n="payLabel">Magkano ang ibabayad?</label>
              <input type="number" id="paymentAmount" class="form-input" placeholder="0.00" min="0.01" step="0.01" oninput="updatePaymentPreview()">
            </div>
            <div class="payment-preview">
              <span data-i18n="payPreview">Matitira pagkatapos:</span>
              <span class="payment-preview-amount" id="paymentRemaining">₱0.00</span>
            </div>
            <div class="sheet-actions">
              <button class="btn btn-secondary" onclick="closePaymentSheet()" data-i18n="cancel">Kanselahin</button>
              <button class="btn btn-primary" onclick="savePayment()" data-i18n="payBtn">Bayad Na ✓</button>
            </div>
          </div>
        </div>
      </div>

      <!-- TOAST -->
      <div class="toast-container" id="toastContainer"></div>
    </div>
    <div class="phone-home-bar"></div>
  </div>

  <!-- TUTORIAL OVERLAY (outside phone-frame for correct position:fixed behavior) -->
  <div id="tutorialRoot">
    <div class="tutorial-overlay" id="tutorialOverlay" style="display:none;">
      <div class="tutorial-backdrop" id="tutorialBackdrop"></div>
      <div class="tutorial-highlight" id="tutorialHighlight"></div>
      <div class="tutorial-box" id="tutorialBox">
        <div class="tutorial-step-indicator">
          <span id="tutorialCurrent">1</span>/<span id="tutorialTotal">8</span>
        </div>
        <div class="tutorial-text" id="tutorialText">Welcome to TindaGo!</div>
        <div class="tutorial-actions">
          <button class="btn btn-secondary btn-sm" id="tutorialSkip" onclick="endTutorial()" data-i18n="skip" style="display:none;">Skip</button>
          <button class="btn btn-secondary btn-sm" id="tutorialPrev" onclick="previousTutorial()" data-i18n="prev" style="display:none;">Previous</button>
          <button class="btn btn-primary btn-sm" id="tutorialNext" onclick="advanceTutorial()" data-i18n="next">Next</button>
        </div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
