<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="img/TindaGo_logo.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>TindaGo - Checkout</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
<style>/* Checkout: search-control base + payment toggle */
.category-label { flex: 1; color: #1e293b; font-size: 16px; font-weight: 500; max-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.search-icon-wrap { display: flex; align-items: center; justify-content: center; }
.payment-toggle { display: flex; gap: 8px; background: #f1f5f9; border-radius: 12px; padding: 4px; }
.payment-btn { flex: 1; padding: 10px; border: none; background: transparent; border-radius: 8px; font-size: 15px; font-weight: 600; color: #64748b; cursor: pointer; transition: all 0.2s; }
.payment-btn.active { background: #16a34a; color: white; }
.payment-btn:hover:not(.active) { color: #1e293b; }</style>
<style>/* morph */.search-control{position:relative;display:flex;width:100%;height:52px;margin-bottom:12px;}.category-container{position:relative;flex:1;min-width:0;height:52px;background:white;border:1px solid var(--border,#cfcfcf);border-right:none;border-radius:12px 0 0 12px;display:flex;align-items:center;}.search-control.search-mode .category-container{flex:0 0 52px;width:52px;min-width:52px;justify-content:center;cursor:pointer;}.category-button{width:100%;height:100%;display:flex;align-items:center;justify-content:space-between;padding:0 16px;border:none;background:transparent;cursor:pointer;font-size:var(--text-base,16px);color:var(--text,#222);text-align:left;}.search-control.search-mode .category-button{justify-content:center;padding:0;}.search-control.search-mode .category-label,.search-control.search-mode .arrow{display:none;}.tiles-icon{display:none;grid-template-columns:repeat(2,7px);grid-template-rows:repeat(2,7px);gap:3px;}.tiles-icon span{display:block;width:7px;height:7px;border:1.8px solid #444;border-radius:1.5px;}.search-control.search-mode .tiles-icon{display:grid;}.action-button{width:52px;height:52px;flex-shrink:0;display:flex;align-items:center;justify-content:center;border:1px solid var(--border,#cfcfcf);border-radius:0 12px 12px 0;background:white;cursor:pointer;position:relative;overflow:hidden;}.search-control.search-mode .action-button{flex:1;width:auto;cursor:text;justify-content:flex-start;padding:0 12px;}.search-control.search-mode .search-icon-wrap{display:none;}.search-input{display:none;width:100%;height:100%;border:none;outline:none;font-size:var(--text-base,16px);color:var(--text,#222);background:transparent;}.search-control.search-mode .search-input{display:block;}.checkout-dropdown{display:none;position:absolute;top:calc(100% + 6px);left:0;width:280px;max-height:360px;overflow-y:auto;background:white;border:1px solid var(--border,#cfcfcf);border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,0.12);z-index:1000;padding:8px;}.checkout-dropdown.open{display:block;}.category-item{padding:10px 12px;border-radius:8px;cursor:pointer;font-size:15px;color:#333;display:flex;align-items:center;justify-content:space-between;}.category-item:hover{background:#f0fdf4;color:#16a34a;}.category-item.active{background:#f0fdf4;font-weight:600;color:#16a34a;}.dropdown-header{display:flex;align-items:center;padding:8px;cursor:pointer;color:#64748b;font-size:13px;font-weight:500;border-bottom:1px solid #e2e8f0;margin-bottom:4px;}</style>

</head>
<body>
  <div class="phone-frame">
    <div class="phone-notch"></div>
    <div class="app-container" id="app">

      <!-- HEADER -->
      <header class="app-header">
        <button class="header-btn" onclick="closeSaleSheet()" aria-label="Back to Day" style="background:none;border:none;cursor:pointer;display:flex;align-items:center;padding:6px;">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
        </button>
        <!-- V2.68: checkout header now uses the current checkoutTitle key (was
             the legacy saleSheetTitle "Someone Bought"/"May Bumili") and is
             center-aligned like every other page that has a Back button. -->
        <h1 style="font-size:var(--text-xl);font-weight:700;flex:1;text-align:center;" id="headerPageTitle" data-i18n="checkoutTitle">Checkout</h1>
        <div class="header-actions">
          <button class="header-btn header-tutorial-btn" id="headerTutorialBtn" onclick="startTutorial('checkout', true)" aria-label="Tutorial">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
          </button>
        </div>
      </header>

      <!-- MAIN CONTENT -->
      <main class="app-content" id="appContent">
                <div class="checkout-stepper" id="checkoutStepper" aria-label="Checkout progress">
          <div class="stepper-dots" id="stepperDots">
            <div class="stepper-dot active" data-step="1">1</div>
            <div class="stepper-line" data-line="1"></div>
            <div class="stepper-dot" data-step="2">2</div>
            <div class="stepper-line" data-line="2"></div>
            <div class="stepper-dot" data-step="3">3</div>
            <div class="stepper-line" data-line="3"></div>
            <div class="stepper-dot" data-step="4">4</div>
          </div>
          <span id="stepperLabel">Step 1 / 4</span>
        </div>
<div class="checkout-page">
          <!-- STEP 1 — Select Products (Stage 1 shell) -->
          <section id="checkoutStep1" class="checkout-step active" aria-label="Select Products">

          <!-- PRODUCT PICKER -->
          <!-- CheckoutCategorySearchField (category view + search view) -->
          <div class="checkout-picker">
            <div class="form-group">
              <label data-i18n="productLabel">What did they buy?</label>
              <div class="product-search-wrap">
                <div class="search-control" id="checkoutSearchControl">
                  <div class="category-container" id="checkoutCategoryContainer">
                    <button class="category-button" id="checkoutCategoryButton" aria-expanded="false" aria-label="Category">
                      <span class="category-label" id="checkoutCategoryLabel">Category</span>
                      <span class="arrow" id="checkoutArrow">▾</span>
                      <span class="tiles-icon" id="checkoutTilesIcon" aria-hidden="true"><span></span><span></span><span></span><span></span></span>
                    </button>
                    <div class="checkout-dropdown" id="checkoutCategoryDropdown"></div>
                  </div>
                  <div class="action-button" id="checkoutActionButton" role="button" tabindex="0" aria-label="Search">
                    <span class="search-icon-wrap" id="checkoutSearchIconWrap">
                      <svg id="checkoutSearchIcon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#555" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                    </span>
                    <input type="text" id="saleProductName" class="search-input" placeholder="Search products..." autocomplete="off" oninput="onProductSearch()" data-i18n-placeholder="searchProduct">
                  </div>
                </div>
                <div class="product-suggestions" id="productSuggestions"></div>
                <div class="selected-product-display" id="selectedProductDisplay" aria-live="polite" role="region" aria-label="Selected product" tabindex="0"></div>
              </div>
            </div>
            <div class="form-group">
              <label data-i18n="saleQtyLabel">Quantity?</label>
              <div class="qty-selector disabled">
                <button class="qty-btn" id="btnQtyMinus" onclick="adjustQty(-1)" aria-label="Decrease quantity">−</button>
                <input type="number" id="saleQty" class="qty-input qty-input-editable" value="1" min="1" disabled oninput="onQtyChange()" onchange="onQtyChange()">
                <button class="qty-btn" id="btnQtyPlus" onclick="adjustQty(1)" aria-label="Increase quantity">+</button>
              </div>
              <div class="stock-hint" id="saleStockHint" aria-live="polite"></div>
            </div>
            <button class="btn btn-primary" id="btnAddToCart" disabled onclick="addToCart()" style="width:100%;">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
              <span data-i18n="addToCart">Add to Cart</span>
            </button>
          </div>
          <div class="wizard-nav">
            <button class="btn btn-secondary" onclick="closeSaleSheet()" data-i18n="close">Close</button>
            <button class="btn btn-primary" id="btnStep1Next" onclick="navigateCheckoutStep(2)" data-i18n="next">Next</button>
          </div>
          </section>
          <!-- STEP 2 — Review Cart -->
          <section id="checkoutStep2" class="checkout-step" aria-label="Review Cart">
          <div class="checkout-section-title" data-i18n="reviewCartTitle" style="margin-bottom:10px;font-weight:700;">Review Cart</div>
          <!-- CART -->
          <div class="sale-cart-section" id="saleCartSection" style="display:none;">
            <div class="sale-cart-header">
              <span class="sale-cart-title" data-i18n="cartTitle">Cart</span>
              <span class="sale-cart-count" id="saleCartCount" aria-live="polite">0</span>
            </div>
            <div class="sale-cart-list" id="saleCartList" role="list"></div>
            <div class="sale-cart-empty" id="saleCartEmpty" data-i18n="cartEmpty" style="display:none;" role="status" aria-live="polite">
              <div style="text-align:center;padding:18px 12px;color:var(--text-muted);">
                <div style="font-size:28px;margin-bottom:6px;">🛒</div>
                <div data-i18n="cartEmpty">Cart is empty</div>
                <div style="font-size:12px;margin-top:4px;" data-i18n="cartEmptyHint">Add products from Step 1 to review them here.</div>
              </div>
            </div>
          </div>
          <!-- Step 2 total (live, Stage 3) -->
          <div class="sale-total-display" id="cartStep2TotalWrap" style="display:none;margin-top:12px;">
            <span class="sale-total-label" data-i18n="saleTotalLabel">Total:</span>
            <span class="sale-total-amount" id="cartStep2Total">₱0.00</span>
          </div>

          <div class="wizard-nav">
            <button class="btn btn-secondary" onclick="navigateCheckoutStep(1)" data-i18n="prev">Back</button>
            <button class="btn btn-primary" id="btnStep2Next" onclick="navigateCheckoutStep(3)" data-i18n="next" disabled>Next</button>
          </div>
          </section>
          <!-- STEP 3 — Select Payment -->
          <section id="checkoutStep3" class="checkout-step" aria-label="Select Payment">
          <!-- PAYMENT -->
          <div class="checkout-section-title" data-i18n="paymentMethod">Payment</div>
          <div class="payment-toggle">
            <button class="payment-btn active" id="salePayCash" onclick="setSalePayment('cash')" data-i18n="payCash">Cash</button>
            <button class="payment-btn" id="salePayGcash" onclick="setSalePayment('gcash')" data-i18n="payGcash">GCash</button>
            <button class="payment-btn" id="salePayCredit" onclick="setSalePayment('credit')" data-i18n="payCredit">Credit (Utang)</button>
          </div>
          <div class="form-group" id="saleCustomerWrap" style="position:relative;display:none;">
            <label data-i18n="saleCustomerLabel">Customer? (for credit)</label>
            <input type="text" id="saleCustomer" class="form-input" placeholder="Customer name" autocomplete="off" oninput="onCustomerSearch()" data-i18n-placeholder="customerPlaceholder">
            <div class="customer-suggestions" id="customerSuggestions"></div>
          <div id="quickSellRow" style="display:none;margin:10px 0;"><div style="font-size:var(--text-xs);color:var(--text-muted);margin-bottom:6px;" data-i18n="quickSellTitle">Quick Sell ⚡</div><div id="quickSellChips" style="display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;"></div></div>
          <div id="recentDebtorsRow" style="display:none;margin:6px 0 10px 0;"><div style="font-size:var(--text-xs);color:var(--text-muted);margin-bottom:6px;" data-i18n="recentDebtors">Recent customers with utang</div><div id="recentDebtorsChips" style="display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;"></div></div>
          </div>
          <div class="form-group" id="salePhoneWrap" style="display:none;">
            <label data-i18n="phoneLabel">Phone Number (optional)</label>
            <input type="tel" id="salePhone" class="form-input" placeholder="09XX XXX XXXX" autocomplete="off" maxlength="13">
          <div style="font-size:var(--text-xxs,12px);color:var(--text-muted);margin-top:4px;" data-i18n="phoneHintSms">Used for SMS receipts and reminders on the mobile app.</div>
          </div>

          <div class="credit-warn" id="saleCreditWarn" style="display:none;"></div>
          <button class="btn btn-secondary btn-sm" id="saleAllowAnyway" onclick="completeSale(true)" style="display:none;width:100%;margin-bottom:12px;" data-i18n="creditAllowAnyway">Allow anyway</button>

          <div class="wizard-nav">
            <button class="btn btn-secondary" onclick="navigateCheckoutStep(2)" data-i18n="prev">Back</button>
            <button class="btn btn-primary" id="btnStep3Next" onclick="navigateCheckoutStep(4)" data-i18n="next">Next</button>
          </div>
          </section>
          <!-- STEP 4 — Confirm Sale -->
          <section id="checkoutStep4" class="checkout-step" aria-label="Confirm Sale">
            <div id="checkoutConfirmSummary" style="background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px;margin-bottom:12px;">
              <div style="font-weight:700;margin-bottom:6px;" data-i18n="confirmSummary">Review your sale</div>
              <div id="confirmSummaryLines" style="font-size:var(--text-sm);color:var(--text-secondary);" data-empty="No items yet"></div>
              <div style="display:flex;justify-content:space-between;margin-top:8px;font-weight:700;"><span data-i18n="saleTotalLabel">Total:</span><span id="confirmTotal">₱0.00</span></div>
            </div>
          <!-- TOTAL -->
          <div class="sale-total-display">
            <span class="sale-total-label" data-i18n="saleTotalLabel">Total:</span>
            <span class="sale-total-amount" id="saleTotalAmount">₱0.00</span>
          </div>

          <!-- ACTIONS -->
          <div class="wizard-nav">
            <button class="btn btn-secondary" onclick="navigateCheckoutStep(3)" data-i18n="prev">Back</button>
            <button class="btn btn-primary" id="btnCompleteSale" onclick="completeSale()">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
              <span data-i18n="completeSale">Complete Sale</span>
            </button>
          </div>
          </section>
        </div>
      </main>

      <!-- TOAST -->
      <div class="toast-container" id="toastContainer"></div>
    </div>
    <div class="phone-home-bar"></div>
  </div>

  <!-- TUTORIAL OVERLAY (outside phone-frame for correct position:fixed behavior) -->
  <div id="tutorialRoot">
    <div class="tutorial-overlay" id="tutorialOverlay" style="display:none;">
      <div class="tutorial-backdrop" id="tutorialBackdrop"></div>
      <div class="tutorial-highlight" id="tutorialHighlight"></div>
      <div class="tutorial-box" id="tutorialBox">
        <div class="tutorial-step-indicator">
          <span id="tutorialCurrent">1</span>/<span id="tutorialTotal">8</span>
        </div>
        <div class="tutorial-text" id="tutorialText">Welcome to TindaGo!</div>
        <div class="tutorial-actions">
          <button class="btn btn-secondary btn-sm" id="tutorialSkip" onclick="endTutorial()" data-i18n="skip" style="display:none;">Skip</button>
          <button class="btn btn-secondary btn-sm" id="tutorialPrev" onclick="previousTutorial()" data-i18n="prev" style="display:none;">Previous</button>
          <button class="btn btn-primary btn-sm" id="tutorialNext" onclick="advanceTutorial()" data-i18n="next">Next</button>
        </div>
      </div>
    </div>
  </div>

  <script src="db_indexed.js"></script>
  <script src="supabase.js"></script>
  <script src="sync.js"></script>
  <script src="checkout_morph.js"></script>
  <script src="forecast.js"></script>
<script src="backup.js"></script>
<script src="category_search.js"></script>
<script src="app.js"></script>
</body>
</html>
