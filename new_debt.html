<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="img/TindaGo_logo.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>TindaGo - New Debt</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="phone-frame">
    <div class="phone-notch"></div>
    <div class="app-container" id="app">
      <!-- HEADER -->
      <header class="app-header" style="background:var(--primary);color:white;">
        <button class="header-btn" onclick="historyBack()" style="color:white;background:none;border:none;cursor:pointer;display:flex;align-items:center;padding:6px;">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
        </button>
        <h1 style="font-size:var(--text-xl);font-weight:700;flex:1;text-align:center;" data-i18n="newDebtTitle">Bagong Utang</h1>
        <button class="header-btn header-tutorial-btn" id="headerTutorialBtn" onclick="startTutorial('new_debt', true)" aria-label="Tutorial" style="color:white;">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
        </button>
      </header>

      <!-- CONTENT -->
      <main class="app-content" id="appContent">
        <div class="form-group" style="position:relative;">
          <label data-i18n="newDebtCustomer">Customer Name</label>
          <input type="text" id="newDebtCustomer" class="form-input" placeholder="Enter name" autocomplete="off" oninput="onNewDebtCustomerSearch()" data-i18n-placeholder="enterCustomerNameDebt">
          <div class="customer-suggestions" id="newDebtSuggestions"></div>
        </div>
        <div class="form-group">
          <label data-i18n="newDebtAmount">Debt Amount (â‚±)</label>
          <input type="number" id="newDebtAmount" class="form-input" placeholder="0.00" min="0.01" step="0.01" oninput="updateNewDebtCreditWarn()">
        </div>
        <div class="form-group">
          <label data-i18n="phoneLabel">Phone Number (optional)</label>
          <input type="tel" id="newDebtPhone" class="form-input" placeholder="09XX XXX XXXX" autocomplete="off" maxlength="13">
        <div style="font-size:var(--text-xxs,12px);color:var(--text-muted);margin-top:4px;" data-i18n="phoneHintSms">Used for SMS receipts and reminders on the mobile app.</div>
        </div>
        <div class="credit-warn" id="newDebtCreditWarn" style="display:none;"></div>
        <button class="btn btn-secondary btn-full" id="newDebtAllowAnyway" onclick="saveNewDebt(true)" style="display:none;margin-bottom:8px;" data-i18n="creditAllowAnyway">Allow anyway</button>
        <button class="btn btn-primary btn-full" onclick="saveNewDebt()" data-i18n="saveDebt">Save Debt</button>
      </main>

      <div class="toast-container" id="toastContainer"></div>
    </div>
    <div class="phone-home-bar"></div>
  </div>

  <!-- TUTORIAL OVERLAY (outside phone-frame for correct position:fixed behavior) -->
  <div id="tutorialRoot">
    <div class="tutorial-overlay" id="tutorialOverlay" style="display:none;">
      <div class="tutorial-backdrop" id="tutorialBackdrop"></div>
      <div class="tutorial-highlight" id="tutorialHighlight"></div>
      <div class="tutorial-box" id="tutorialBox">
        <div class="tutorial-step-indicator">
          <span id="tutorialCurrent">1</span>/<span id="tutorialTotal">4</span>
        </div>
        <div class="tutorial-text" id="tutorialText">Welcome to TindaGo!</div>
        <div class="tutorial-actions">
          <button class="btn btn-secondary btn-sm" id="tutorialSkip" onclick="endTutorial()" data-i18n="skip" style="display:none;">Skip</button>
          <button class="btn btn-secondary btn-sm" id="tutorialPrev" onclick="previousTutorial()" data-i18n="prev" style="display:none;">Previous</button>
          <button class="btn btn-primary btn-sm" id="tutorialNext" onclick="advanceTutorial()" data-i18n="next">Next</button>
        </div>
      </div>
    </div>
  </div>

  <script src="db_indexed.js"></script>
  <script src="supabase.js"></script>
  <script src="sync.js"></script>
  <script src="backup.js"></script>
<script src="app.js"></script>
</body>
</html>
