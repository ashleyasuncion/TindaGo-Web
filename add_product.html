<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="img/TindaGo_logo.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>TindaGo - Add Stock</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="phone-frame">
    <div class="phone-notch"></div>
    <div class="app-container" id="app">
      <!-- HEADER -->
      <header class="app-header" style="background:var(--primary);color:white;">
        <button class="header-btn" onclick="historyBack()" style="color:white;background:none;border:none;cursor:pointer;display:flex;align-items:center;padding:6px;">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
        </button>
        <h1 style="font-size:var(--text-xl);font-weight:700;flex:1;text-align:center;" id="addProductTitle" data-i18n="addProductTitle">Add Stock</h1>
        <div class="header-actions">
          <button class="header-btn header-tutorial-btn" id="headerTutorialBtn" onclick="startTutorial('add_product', true)" aria-label="Tutorial">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
          </button>
        </div>
      </header>

      <!-- CONTENT -->
      <main class="app-content" id="appContent">
        <div class="form-group">
          <label for="productName" data-i18n="productNameLabel">Product Name</label>
          <input type="text" id="productName" class="form-input" autocomplete="off" data-i18n-placeholder="productName" placeholder="e.g. Canned Tuna">
        </div>

        <!-- Product Details (optional) — each field is its own form-group,
             matching the rest of the form (v2.59 cleanup: removed the
             single-wrapper .pd-section so all fields share one structure). -->
        <div style="font-weight:700;color:var(--primary);font-size:var(--text-base);margin-top:6px;" data-i18n="productDetailsSection">Product Details</div>
        <div style="font-size:var(--text-sm);color:#94a3b8;margin-bottom:12px;" data-i18n="productDetailsHint">Optional — helps identify and sort your products</div>

        <div class="form-group">
          <label for="productCategory" data-i18n="categoryLabel">Category</label>
          <select id="productCategory" class="form-input">
            <option value="">All</option>
          </select>
        </div>
        <div class="form-group">
          <label for="productBrand" data-i18n="brandLabel">Brand</label>
          <input type="text" id="productBrand" class="form-input" list="productBrandList" autocomplete="off" data-i18n-placeholder="brandPlaceholder" placeholder="e.g. Ligo, Bear Brand">
          <datalist id="productBrandList"></datalist>
        </div>
        <div class="form-group">
          <label for="productUnit" data-i18n="unitLabel">Unit</label>
          <select id="productUnit" class="form-input">
            <option value="piece">piece</option>
          </select>
        </div>
        <div class="form-group">
          <label for="productPackageSize" data-i18n="packageSizeLabel">Package Size</label>
          <input type="text" id="productPackageSize" class="form-input" list="productPackageSizeList" autocomplete="off" data-i18n-placeholder="packageSizePlaceholder" placeholder="e.g. 155g, 1L">
          <datalist id="productPackageSizeList"></datalist>
        </div>

        <div class="form-group">
          <label for="productQty" data-i18n="productQtyLabel">Quantity</label>
          <input type="number" id="productQty" class="form-input" placeholder="0.25" min="0.01" step="0.01" inputmode="decimal">
        </div>
        <div class="form-group">
          <label for="productCost" data-i18n="costLabel">Cost Price (₱)</label>
          <input type="number" id="productCost" class="form-input" placeholder="0.00" min="0" step="0.01">
        </div>

        <!-- Markup Helper -->
        <div class="markup-helper" id="markupSuggestion" style="display:none;">
          <div class="hint" id="markupHint">At 20% markup, sell at</div>
          <div class="suggested" id="markupSuggestedPrice">₱0.00</div>
          <div class="hint"><span data-i18n="suggestedPrice">Suggested</span></div>
        </div>

        <div class="form-group">
          <label for="productMarkup" data-i18n="markupLabel">Markup (%)<span class="help-icon">?<span class="help-tooltip">Added to cost price to set selling price. Example: ₱100 cost + 20% = ₱120 selling price.</span></span></label>
          <input type="number" id="productMarkup" class="form-input" placeholder="20" min="0" max="1000" step="1">
          <div class="markup-hint" id="productMarkupHint"></div>
        </div>
        <div class="form-group">
          <label for="productPrice" data-i18n="priceLabel">Selling Price (₱)</label>
          <input type="number" id="productPrice" class="form-input" placeholder="0.00" min="0" step="0.01">
        </div>
        <div class="form-group">
          <label for="productLowStock" data-i18n="lowStockAlertLabel">Low Stock Alert At<span class="help-icon">?<span class="help-tooltip">You'll get an alert when stock falls below this number.</span></span></label>
          <input type="number" id="productLowStock" class="form-input" placeholder="0.25" min="0" max="999" step="0.01" inputmode="decimal">
          <div class="markup-hint" data-i18n="alertThresholdDesc">Alert when stock is low</div>
        </div>
        <input type="hidden" id="editProductId">
        <button class="btn btn-primary btn-full" onclick="saveProduct()" data-i18n="saveBtn">Save</button>
      </main>

      <div class="toast-container" id="toastContainer"></div>
    </div>
    <div class="phone-home-bar"></div>
  </div>

  <!-- TUTORIAL OVERLAY (outside phone-frame for correct position:fixed behavior) -->
  <div id="tutorialRoot">
    <div class="tutorial-overlay" id="tutorialOverlay" style="display:none;">
      <div class="tutorial-backdrop" id="tutorialBackdrop"></div>
      <div class="tutorial-highlight" id="tutorialHighlight"></div>
      <div class="tutorial-box" id="tutorialBox">
        <div class="tutorial-step-indicator">
          <span id="tutorialCurrent">1</span>/<span id="tutorialTotal">8</span>
        </div>
        <div class="tutorial-text" id="tutorialText">Welcome to TindaGo!</div>
        <div class="tutorial-actions">
          <button class="btn btn-secondary btn-sm" id="tutorialSkip" onclick="endTutorial()" data-i18n="skip" style="display:none;">Skip</button>
          <button class="btn btn-secondary btn-sm" id="tutorialPrev" onclick="previousTutorial()" data-i18n="prev" style="display:none;">Previous</button>
          <button class="btn btn-primary btn-sm" id="tutorialNext" onclick="advanceTutorial()" data-i18n="next">Next</button>
        </div>
      </div>
    </div>
  </div>

  <script src="db_indexed.js"></script>
  <script src="supabase.js"></script>
  <script src="sync.js"></script>
  <script src="backup.js"></script>
<script src="app.js"></script>
</body>
</html>
