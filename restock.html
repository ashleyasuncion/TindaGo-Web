<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="img/TindaGo_logo.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>TindaGo - Restock Day</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="phone-frame">
    <div class="phone-notch"></div>
    <div class="app-container" id="app">
      <!-- HEADER -->
      <header class="app-header restock-header">
        <button class="header-btn" onclick="historyBack()" aria-label="Back">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
        </button>
        <h1 style="font-size:var(--text-xl);font-weight:700;flex:1;text-align:center;" id="restockTitle">Restock Day 🚚</h1>
        <button class="header-btn header-tutorial-btn" id="headerTutorialBtn" onclick="startTutorial('restock', true)" aria-label="Tutorial">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
        </button>
      </header>

      <!-- MAIN CONTENT -->
      <main class="app-content" id="appContent">
        <!-- Step Indicator -->
        <div class="restock-step-indicator">
          <div class="restock-step-dot active" id="restockStep1Dot">1</div>
          <div class="restock-step-line"></div>
          <div class="restock-step-dot" id="restockStep2Dot">2</div>
        </div>

        <!-- ===== STEP 1: Physical Count ===== -->
        <div id="restockStep1">
          <div class="restock-section-header" id="restockCorrectionHeader">Step 1: Check Shelves</div>
          <p class="restock-section-desc" id="restockStep1Desc">Ilagay ang bilang sa shelf para ihambing sa stock ng app.</p>

          <!-- Search -->
          <div class="search-bar" style="margin-bottom:12px;">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            <input type="text" id="restockSearch" class="form-input" placeholder="Maghanap ng produkto..." style="border:none;padding:0;">
          </div>

          <div class="restock-correction-count" id="restockCorrectionCount">0/0 items checked</div>

          <!-- Product list (padding-bottom for sticky action bar) -->
          <div class="list-container restock-list" id="restockProductList" style="padding-bottom:96px;"></div>

          <!-- Back-to-top button (visible when product list scrolls out of view) -->
          <button class="back-to-top" id="restockBackToTopBtn" onclick="document.getElementById('appContent').scrollTo({top:0,behavior:'smooth'})" style="display:none;">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="18 15 12 9 6 15"/></svg>
          </button>
        </div>

        <!-- Sticky action bar (Step 1 only) -->
        <div class="restock-sticky-bar" id="restockStickyBar">
          <button class="btn btn-secondary btn-sm" onclick="window.restockCancelRestock()">
            <span>Cancel</span>
          </button>
          <button class="btn btn-primary" id="restockContinueBtn" onclick="window.restockContinueToPurchases()" style="flex:1;">
            <span>Continue →</span>
          </button>
        </div>

        <!-- ===== STEP 2: Record Purchases ===== -->
        <div id="restockStep2" style="display:none;">
          <div class="restock-section-header" id="restockPurchaseHeader">Step 2: Record Purchases</div>
          <p class="restock-section-desc" id="restockStep2Desc">Maghanap ng produkto, pagkatapos ilagay ang presyo at dami.</p>

          <!-- Add purchase form -->
          <div class="restock-purchase-form">
            <div class="product-search-wrap" style="margin-bottom:12px;">
              <div class="search-bar">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                <input type="text" id="restockPurchaseProduct" placeholder="Maghanap ng produkto..." autocomplete="off">
              </div>
              <div class="product-suggestions" id="restockPurchaseSuggestions"></div>
            </div>
            <div style="display:flex;gap:8px;margin-bottom:12px;">
              <div class="form-group" style="flex:1;margin-bottom:0;">
                <label>Cost/unit (₱)</label>
                <input type="number" id="restockPurchaseCost" class="form-input" placeholder="0.00" min="0" step="0.01">
              </div>
              <div class="form-group" style="flex:1;margin-bottom:0;">
                <label>Qty</label>
                <input type="number" id="restockPurchaseQty" class="form-input" value="1" min="0.01" step="0.01" inputmode="decimal">
              </div>
            </div>
            <button class="btn btn-primary btn-full" id="restockPurchaseAddBtn" onclick="window.restockAddPurchase()">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
              <span>Add Item</span>
            </button>
            <div class="restock-divider"></div>
          </div>

          <!-- Purchased items list -->
          <div class="list-container restock-list" id="restockPurchaseList">
            <div class="restock-empty">No items added yet.</div>
          </div>

          <!-- Total -->
          <div class="restock-total-row" id="restockTotalRow" style="margin-bottom:96px;">
            <span>Total Spent</span>
            <span class="restock-total-amount" id="restockPurchaseTotal">₱0.00</span>
          </div>
        </div>

        <!-- Sticky action bar (Step 2 only) -->
        <div class="restock-sticky-bar" id="restockStickyBar2" style="display:none;">
          <button class="btn btn-secondary btn-sm" onclick="window.restockBackToStep1()">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="margin-right:2px;"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
            <span>Back</span>
          </button>
          <button class="btn btn-primary" id="restockDoneBtn" onclick="window.restockCompleteRestock()" style="flex:1;">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="margin-right:4px;"><polyline points="20 6 9 17 4 12"/></svg>
            <span>Done ✓</span>
          </button>
        </div>
      </main>

      <div id="ordersBubble" class="orders-bubble">
        <span class="orders-bubble-badge"></span>
      </div>

      <div class="toast-container" id="toastContainer"></div>
    </div>
    <div class="phone-home-bar"></div>
  </div>

  <!-- TUTORIAL OVERLAY (outside phone-frame for correct position:fixed behavior) -->
  <div id="tutorialRoot">
    <div class="tutorial-overlay" id="tutorialOverlay" style="display:none;">
      <div class="tutorial-backdrop" id="tutorialBackdrop"></div>
      <div class="tutorial-highlight" id="tutorialHighlight"></div>
      <div class="tutorial-box" id="tutorialBox">
        <div class="tutorial-step-indicator">
          <span id="tutorialCurrent">1</span>/<span id="tutorialTotal">8</span>
        </div>
        <div class="tutorial-text" id="tutorialText">Welcome to TindaGo!</div>
        <div class="tutorial-actions">
          <button class="btn btn-secondary btn-sm" id="tutorialSkip" onclick="endTutorial()" data-i18n="skip" style="display:none;">Skip</button>
          <button class="btn btn-secondary btn-sm" id="tutorialPrev" onclick="previousTutorial()" data-i18n="prev" style="display:none;">Previous</button>
          <button class="btn btn-primary btn-sm" id="tutorialNext" onclick="advanceTutorial()" data-i18n="next">Next</button>
        </div>
      </div>
    </div>
  </div>

  <script src="db_indexed.js"></script>
  <script src="supabase.js"></script>
  <script src="sync.js"></script>
  <script src="backup.js"></script>
<script src="app.js"></script>
  <script src="restock.js"></script>
</body>
</html>
