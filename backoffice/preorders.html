<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pre-Orders — TindaGo Back Office</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="../img/TindaGo_logo.png">
  <link href="sidebar.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="db.js"></script>
  <script src="sidebar.js"></script>
  <style>
    :root { --primary:#16a34a; --primary-dark:#15803d; --primary-light:#dcfce7; --primary-bg:#f0fdf4; --danger:#dc2626; --danger-light:#fef2f2; --bg:#f8faf9; --surface:#ffffff; --text:#1e293b; --text-secondary:#64748b; --border:#e2e8f0; --shadow:0 2px 8px rgba(0,0,0,0.08); --shadow-lg:0 8px 24px rgba(0,0,0,0.12); --radius:12px; --radius-lg:16px; --font:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif; }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{font-family:var(--font);color:var(--text);background:var(--bg);min-height:100vh;overflow:auto;-webkit-font-smoothing:antialiased}
    .topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 24px;background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:50}
    .topbar-brand{display:flex;align-items:center;gap:10px;font-size:18px;font-weight:800;color:var(--primary);text-decoration:none}
    .topbar-brand img{width:30px;height:30px;border-radius:8px}
    .topbar-right{display:flex;align-items:center;gap:12px}
    .sync-pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--primary-dark);background:var(--primary-light);padding:6px 12px;border-radius:20px;border:1px solid #bbf7d0}
    .sync-pill.nodata{color:var(--text-secondary);background:var(--bg);border-color:var(--border)}
    .sync-dot{width:8px;height:8px;border-radius:50%;background:currentColor}
    .btn-signout{display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;padding:0;background:var(--surface);color:var(--text-secondary);font-size:14px;font-weight:600;font-family:var(--font);border:1.5px solid var(--border);border-radius:10px;cursor:pointer}
    .btn-signout:hover{color:var(--danger);border-color:#fecaca;background:var(--danger-light)}
    .layout{display:flex;min-height:calc(100vh - 59px)}
    .content{flex:1;min-width:0;padding:28px}
    .page-title{font-size:24px;font-weight:800;color:var(--text);margin-bottom:6px}
    .page-subtitle{font-size:14px;color:var(--text-secondary);margin-bottom:20px}
    .error-box{display:none;background:var(--danger-light);color:var(--danger);border:1px solid #fecaca;border-radius:var(--radius);padding:12px 16px;font-size:14px;font-weight:500;margin-bottom:16px}
    .error-box.show{display:block}
    .success-box{display:none;background:var(--primary-light);color:var(--primary-dark);border:1px solid #bbf7d0;border-radius:var(--radius);padding:12px 16px;font-size:14px;font-weight:500;margin-bottom:16px}
    .success-box.show{display:block}
    .toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap}
    .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:none;border-radius:10px;padding:10px 18px;font-size:14px;font-weight:700;font-family:var(--font);cursor:pointer;transition:filter 0.15s, background 0.15s, color 0.15s, border-color 0.15s}
    .btn-primary{background:var(--primary);color:#fff;box-shadow:0 1px 3px rgba(22,163,74,0.4)}
    .btn-primary:hover{filter:brightness(1.05)}
    .btn-primary:disabled{background:var(--border);color:var(--text-secondary);box-shadow:none;cursor:not-allowed}
    .btn-outline{background:var(--surface);color:var(--primary-dark);border:1.5px solid var(--primary)}
    .btn-outline:hover{background:var(--primary-light)}
    .btn-danger{background:var(--surface);color:var(--danger);border:1.5px solid var(--danger)}
    .btn-danger:hover{background:var(--danger-light)}
    .btn-sm{padding:6px 12px;font-size:12px;border-radius:8px}
    .empty-state{background:var(--surface);border:1px dashed var(--border);border-radius:var(--radius-lg);padding:40px 20px;text-align:center;color:var(--text-secondary);font-size:14px;line-height:1.6}
    .card-list{display:grid;gap:16px}
    .po-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);box-shadow:var(--shadow);padding:18px 20px;display:flex;flex-direction:column;gap:12px}
    .po-header{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
    .po-tempid{font-size:18px;font-weight:800;color:var(--primary-dark);letter-spacing:0.3px}
    .po-meta{font-size:12px;color:var(--text-secondary);display:flex;flex-direction:column;align-items:flex-end;gap:4px;text-align:right}
    .po-total{font-size:16px;font-weight:700;color:var(--text)}
    .po-customer{font-size:13px;color:var(--text);font-weight:600}
    .po-note{font-size:12px;color:var(--text-secondary);font-style:italic;line-height:1.4}
    .po-items{font-size:13px;color:var(--text-secondary);line-height:1.5}
    .po-method{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;text-transform:uppercase;color:var(--text-secondary);background:var(--bg);border:1px solid var(--border);padding:3px 8px;border-radius:6px}
    .po-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
    @media (max-width:640px){.content{padding:16px}.po-header{flex-direction:column;align-items:flex-start}.po-meta{align-items:flex-start;text-align:left}}
  </style>
</head>
<body>
<header class="topbar">
  <a href="dashboard.html" class="topbar-brand" id="brandToggle" title="Toggle navigation" aria-label="Toggle navigation" aria-controls="sidenav" aria-expanded="false"><img src="../img/TindaGo_logo.png" alt="TindaGo logo">TindaGo Back Office</a>
  <div class="topbar-right">
    <span class="sync-pill nodata" id="syncPill"><span class="sync-dot"></span><span id="syncPillText">Loading&hellip;</span></span>
    <button type="button" id="btnSignout" class="btn-signout" title="Sign Out" aria-label="Sign Out">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
    </button>
  </div>
</header>
<div id="sidenavHost"></div>
<div class="layout">
<main class="content">
  <h1 class="page-title">Pre-Orders</h1>
  <p id="pageSubtitle" class="page-subtitle">Pending customer pre-orders for your store.</p>
  <div id="errorBox" class="error-box"></div>
  <div id="successBox" class="success-box"></div>

  <div class="toolbar">
    <a href="dashboard.html" class="btn btn-outline">Back to Dashboard</a>
    <button type="button" id="btnRefresh" class="btn btn-outline">Refresh</button>
  </div>

  <div id="listHost" class="card-list"></div>
</main>
</div>

<script>
  const $ = function (id) { return document.getElementById(id); };
  function esc(s) { var d = document.createElement('div'); d.textContent = s == null ? '' : String(s); return d.innerHTML; }
  function peso(n) {
    var v = Number(n) || 0;
    return '₱' + v.toLocaleString('en-PH', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }
  function showBanner(b) { try { b.scrollIntoView({ behavior: 'smooth', block: 'nearest' }); } catch (e) {} }
  function showError(m) { var b = $('errorBox'); if (b) { b.textContent = m; b.classList.add('show'); showBanner(b); } }
  function clearError() { var b = $('errorBox'); if (b) { b.textContent = ''; b.classList.remove('show'); } }
  function showSuccess(m) { var b = $('successBox'); if (b) { b.textContent = m; b.classList.add('show'); showBanner(b); } }
  function clearSuccess() { var b = $('successBox'); if (b) { b.textContent = ''; b.classList.remove('show'); } }
  function clearBanners() { clearError(); clearSuccess(); }

  // Time-ago label from a bigint epoch-ms timestamp. Mirrors the Android
  // inbox's relative-time display so both surfaces read consistently.
  function timeAgo(ms) {
    var n = Number(ms) || 0;
    if (n <= 0) return '';
    var diff = Date.now() - n;
    if (diff < 0) diff = 0;
    var sec = Math.floor(diff / 1000);
    if (sec < 60) return 'just now';
    var min = Math.floor(sec / 60);
    if (min < 60) return min + 'm ago';
    var hr = Math.floor(min / 60);
    if (hr < 24) return hr + 'h ago';
    var d = Math.floor(hr / 24);
    return d + 'd ago';
  }

  // Parse items_json safely. Returns [] on any failure so a malformed row
  // never crashes the whole inbox render.
  function parseItems(json) {
    try { return JSON.parse(json || '[]') || []; } catch (_) { return []; }
  }

  function paintSyncPill(count) {
    var pill = $('syncPill'), txt = $('syncPillText');
    if (!pill || !txt) return;
    if (count === null) { pill.className = 'sync-pill nodata'; txt.textContent = 'Loading…'; return; }
    if (count === 0) { pill.className = 'sync-pill nodata'; txt.textContent = 'No pending orders'; return; }
    pill.className = 'sync-pill'; txt.textContent = count + ' pending';
  }

  function renderList(rows) {
    var host = $('listHost');
    if (!host) return;
    if (!rows.length) {
      host.innerHTML = '<div class="empty-state">No pending pre-orders right now.<br>When customers place orders through your QR page, they appear here.</div>';
      paintSyncPill(0);
      return;
    }
    paintSyncPill(rows.length);
    var html = '';
    for (var i = 0; i < rows.length; i++) {
      var r = rows[i];
      var items = parseItems(r.itemsJson);
      var summary = items.length
        ? items.map(function (it) { return (Number(it.qty) || 0) + '× ' + (it.name || 'item'); }).join(', ')
        : '(no items)';
      var note = (r.customerNote || '').trim();
      var when = timeAgo(r.createdAt);
      var method = (r.paymentMethod || 'cash').toUpperCase();
      html +=
        '<article class="po-card" data-id="' + esc(r.id) + '">' +
          '<div class="po-header">' +
            '<div>' +
              '<div class="po-tempid">' + esc(r.tempId || '—') + '</div>' +
              (note ? '<div class="po-note">“' + esc(note) + '”</div>' : '') +
            '</div>' +
            '<div class="po-meta">' +
              '<div class="po-total">' + peso(r.totalAmount) + '</div>' +
              (when ? '<div>' + esc(when) + '</div>' : '') +
              '<div class="po-method">' + esc(method) + '</div>' +
            '</div>' +
          '</div>' +
          '<div class="po-items">' + esc(summary) + '</div>' +
          '<div class="po-actions">' +
            '<button type="button" class="btn btn-primary btn-sm" data-action="validate" data-id="' + esc(r.id) + '">Validate</button>' +
            '<button type="button" class="btn btn-danger btn-sm" data-action="cancel" data-id="' + esc(r.id) + '">Cancel</button>' +
          '</div>' +
        '</article>';
    }
    host.innerHTML = html;
  }

  var _busy = {}; // id -> true while an action is in flight

  async function load() {
    clearBanners();
    paintSyncPill(null);
    $('listHost').innerHTML = '<div class="empty-state">Loading pending pre-orders…</div>';
    try {
      var rows = await DB.getPendingPreOrders();
      renderList(rows);
    } catch (e) {
      console.error('load pre-orders:', e);
      showError('Could not load pre-orders: ' + (e.message || 'unknown error'));
      paintSyncPill(0);
      $('listHost').innerHTML = '';
    }
  }

  // VALIDATE: mark fulfilled + paid. Mirrors AppViewModel.validatePreOrder
  // (STATUS_FULFILLED / PAYMENT_PAID). The web inbox does not run completeSale
  // (that is an Android-only stock transaction); it only updates Supabase so
  // the order drops out of both inboxes.
  async function doValidate(id) {
    if (_busy[id]) return;
    _busy[id] = true;
    clearBanners();
    try {
      var res = await DB.updatePreOrderStatus(id, {
        status: 'fulfilled',
        payment_status: 'paid',
        fulfilled_at: Date.now()
      });
      if (!res) {
        showError('Could not validate order. Please try again.');
        return;
      }
      showSuccess('Order validated and marked as paid.');
      await load();
    } catch (e) {
      console.error('validatePreOrder:', e);
      showError('Validate failed: ' + (e.message || 'unknown error'));
    } finally {
      delete _busy[id];
    }
  }

  // CANCEL: mark cancelled, keep existing payment_status. Mirrors
  // AppViewModel.cancelPreOrder (STATUS_CANCELLED + unchanged payment).
  async function doCancel(id) {
    if (_busy[id]) return;
    if (!window.confirm('Cancel this pre-order? This cannot be undone.')) return;
    _busy[id] = true;
    clearBanners();
    try {
      // Fetch the row first so we can preserve its payment_status on cancel
      // (matches Android: cancel keeps the original payment_status).
      var current = null;
      try {
        var all = await DB.getPendingPreOrders();
        for (var i = 0; i < all.length; i++) {
          if (String(all[i].id) === String(id)) { current = all[i]; break; }
        }
      } catch (_) { /* best-effort; fall back to unpaid */ }
      var pay = (current && current.paymentStatus) ? current.paymentStatus : 'unpaid';
      var res = await DB.updatePreOrderStatus(id, {
        status: 'cancelled',
        payment_status: pay
      });
      if (!res) {
        showError('Could not cancel order. Please try again.');
        return;
      }
      showSuccess('Order cancelled.');
      await load();
    } catch (e) {
      console.error('cancelPreOrder:', e);
      showError('Cancel failed: ' + (e.message || 'unknown error'));
    } finally {
      delete _busy[id];
    }
  }

  async function main() {
    const session = await requireAuth();
    if (!session) return;
    $('btnSignout').addEventListener('click', signOut);
    DB.init(session);
    $('pageSubtitle').textContent =
      'Pending customer pre-orders · signed in as ' + (session.user.email || 'store');

    $('listHost').addEventListener('click', function (e) {
      var btn = e.target.closest('[data-action]');
      if (!btn) return;
      var id = btn.getAttribute('data-id');
      var act = btn.getAttribute('data-action');
      if (act === 'validate') doValidate(id);
      else if (act === 'cancel') doCancel(id);
    });

    $('btnRefresh').addEventListener('click', load);

    await load();
  }

  if (typeof initSidebar === 'function') initSidebar('preorders.html');
  main().catch(function (err) {
    console.error('preorders fatal:', err);
    var box = document.getElementById('errorBox');
    if (box) { box.textContent = 'Pre-Orders page failed to start: ' + (err.message || 'unknown error'); box.classList.add('show'); }
  });
</script>
</body>
</html>
