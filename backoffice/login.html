<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — TindaGo Back Office</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="../img/TindaGo_logo.png">
  <style>
    /* ─── TindaGo Back-Office Login (standalone, no phone frame) ─── */
    /* Design tokens mirror style.css :root values (private copy — the
       prototype style.css is NOT linked, keeping the portal isolated). */
    :root {
      --primary: #16a34a;
      --primary-dark: #15803d;
      --primary-light: #dcfce7;
      --primary-bg: #f0fdf4;
      --danger: #dc2626;
      --danger-light: #fef2f2;
      --bg: #f8faf9;
      --surface: #ffffff;
      --text: #1e293b;
      --text-secondary: #64748b;
      --border: #e2e8f0;
      --shadow: 0 2px 8px rgba(0,0,0,0.08);
      --shadow-lg: 0 8px 24px rgba(0,0,0,0.12);
      --radius: 12px;
      --radius-lg: 16px;
      --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font);
      color: var(--text);
      background: var(--bg);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
      overflow: auto;
      -webkit-font-smoothing: antialiased;
    }

    /* ─── Sign-In Card ─── */
    .login-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-lg);
      padding: 40px;
      width: 100%;
      max-width: 420px;
    }

    .login-logo {
      display: block;
      width: 72px;
      height: 72px;
      margin: 0 auto 16px;
      border-radius: 18px;
      box-shadow: 0 4px 16px rgba(22,163,74,0.25);
    }

    .login-title {
      font-size: 26px;
      font-weight: 800;
      text-align: center;
      color: var(--text);
      margin-bottom: 4px;
    }

    .login-subtitle {
      font-size: 14px;
      color: var(--text-secondary);
      text-align: center;
      margin-bottom: 28px;
    }

    /* ─── Form Fields ─── */
    .form-group { margin-bottom: 16px; }

    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-secondary);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .form-input {
      width: 100%;
      padding: 12px 14px;
      font-size: 15px;
      font-family: var(--font);
      color: var(--text);
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .form-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(22, 163, 74, 0.15);
    }
    .form-input::placeholder { color: #94a3b8; }

    /* ─── Sign-In Button ─── */
    .btn-signin {
      width: 100%;
      padding: 14px;
      background: var(--primary);
      color: white;
      font-size: 16px;
      font-weight: 700;
      font-family: var(--font);
      border: none;
      border-radius: var(--radius);
      cursor: pointer;
      transition: background 0.2s, transform 0.15s;
      box-shadow: 0 4px 14px rgba(22, 163, 74, 0.3);
      margin-top: 8px;
    }
    .btn-signin:hover:not(:disabled) { background: var(--primary-dark); }
    .btn-signin:active:not(:disabled) { transform: scale(0.98); }
    .btn-signin:disabled {
      background: #94a3b8;
      cursor: not-allowed;
      box-shadow: none;
    }

    /* ─── Error Banner (auth failures) ─── */
    .error-banner {
      display: none;
      background: var(--danger-light);
      border: 1px solid #fecaca;
      color: var(--danger);
      font-size: 14px;
      font-weight: 500;
      padding: 12px 14px;
      border-radius: var(--radius);
      margin-bottom: 20px;
      line-height: 1.5;
    }
    .error-banner.show { display: block; }

    .backoffice-badge {
      text-align: center;
      font-size: 12px;
      color: #94a3b8;
      margin-top: 24px;
      letter-spacing: 0.5px;
    }

    /* ─── Responsive (mobile) ─── */
    @media (max-width: 480px) {
      body { padding: 16px; align-items: flex-start; padding-top: 60px; }
      .login-card { padding: 28px 20px; }
      .login-title { font-size: 22px; }
    }
  </style>
</head>
<body>

  <div class="login-card">
    <img src="../img/TindaGo_logo.png" alt="TindaGo" class="login-logo">
    <h1 class="login-title">TindaGo Back Office</h1>
    <p class="login-subtitle">Sign in to view store analytics and manage suppliers.</p>

    <!-- Real-time authentication error banner -->
    <div class="error-banner" id="errorBanner"></div>

    <form id="loginForm" autocomplete="on">
      <div class="form-group">
        <label for="loginEmail">Email</label>
        <input type="email" id="loginEmail" class="form-input" placeholder="tindago@test.com" autocomplete="email" required>
      </div>
      <div class="form-group">
        <label for="loginPassword">Password</label>
        <input type="password" id="loginPassword" class="form-input" placeholder="••••••••" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn-signin" id="btnSignin">Sign In</button>
    </form>

    <p class="backoffice-badge">BACK-OFFICE WEB PORTAL · PHASE 3</p>
  </div>

  <!-- Supabase CDN client (v2) + Back-office auth helpers -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script>
    const form = document.getElementById('loginForm');
    const emailInput = document.getElementById('loginEmail');
    const passwordInput = document.getElementById('loginPassword');
    const btn = document.getElementById('btnSignin');
    const errorBanner = document.getElementById('errorBanner');

    function showError(message) {
      errorBanner.textContent = message;
      errorBanner.classList.add('show');
    }

    function clearError() {
      errorBanner.textContent = '';
      errorBanner.classList.remove('show');
    }

    function setLoading(loading) {
      btn.disabled = loading;
      btn.textContent = loading ? 'Signing in…' : 'Sign In';
    }

    // ── Auto-redirect: if a session already exists, go straight to the dashboard ──
    (async function checkExistingSession() {
      try {
        const { data: { session } } = await sb.auth.getSession();
        if (session) {
          window.location.href = 'dashboard.html';
        }
      } catch (err) {
        console.warn('Session check failed:', err);
      }
    })();

    // ── Sign-In (Supabase Auth) ──
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      clearError();

      const email = emailInput.value.trim();
      const password = passwordInput.value;

      if (!email || !password) {
        showError('Please enter both your email and password.');
        return;
      }

      setLoading(true);
      try {
        const { data, error } = await sb.auth.signInWithPassword({ email, password });

        if (error) {
          showError(error.message);
          setLoading(false);
          return;
        }

        if (data.session) {
          window.location.href = 'dashboard.html';
        } else {
          showError('Sign-in succeeded but no session was returned. Please try again.');
          setLoading(false);
        }
      } catch (err) {
        console.error('Sign-in error:', err);
        showError('Network error — could not reach the authentication server. Please check your internet connection.');
        setLoading(false);
      }
    });
  </script>
</body>
</html>
